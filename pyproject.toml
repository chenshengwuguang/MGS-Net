[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mgs-net"
version = "0.1.0"
description = "Morphology-Guided Segmentation Network for weld defect segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "chenshengwuguang"}]
dependencies = ["torch>=2.6", "numpy>=1.24", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/chenshengwuguang/MGS-Net"

[tool.setuptools.packages.find]
include = ["mgs_net*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

